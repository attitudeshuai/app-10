version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: device-maint-postgres
    environment:
      POSTGRES_DB: devicemaintenance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: device-maint-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=devicemaintenance;Username=postgres;Password=postgres123
      - JwtSettings__SecretKey=this_is_a_very_long_secret_key_for_jwt_token_generation_please_change_in_production
      - JwtSettings__Issuer=DeviceMaintenanceSystem
      - JwtSettings__Audience=DeviceMaintenanceSystem
      - JwtSettings__ExpirationMinutes=1440
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
